<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>诺瓦&嗨动 产品培训考核系统 V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--primary:#2563eb;--primary-dark:#1d4ed8;--primary-light:#dbeafe;
--nova:#dc2626;--nova-light:#fee2e2;--nova-dark:#b91c1c;
--haidong:#2563eb;--haidong-light:#dbeafe;--haidong-dark:#1d4ed8;
--bg:#f1f5f9;--card:#fff;--text:#0f172a;--text-sec:#64748b;
--border:#e2e8f0;--success:#16a34a;--success-light:#dcfce7;
--warning:#d97706;--warning-light:#fef3c7;--danger:#dc2626;--danger-light:#fee2e2;
--shadow:0 1px 3px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1);
--radius:12px;--radius-sm:8px;
--newbie-color:#059669;--newbie-light:#d1fae5;
--tech-color:#7c3aed;--tech-light:#ede9fe;
--sales-color:#ea580c;--sales-light:#fff7ed;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
#app{min-height:100vh}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.9}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 14px;font-size:13px}.btn-lg{padding:14px 32px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-newbie{background:var(--newbie-color);color:#fff}.btn-tech{background:var(--tech-color);color:#fff}.btn-sales{background:var(--sales-color);color:#fff}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.card-title{font-size:1.1rem;font-weight:600;margin-bottom:8px}

/* Badge */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-newbie{background:var(--newbie-light);color:var(--newbie-color)}
.badge-tech{background:var(--tech-light);color:var(--tech-color)}
.badge-sales{background:var(--sales-light);color:var(--sales-color)}

/* Forms */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;transition:border-color .2s;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;z-index:9999;animation:slideIn .3s ease;box-shadow:var(--shadow-lg)}
.toast-success{background:var(--success);color:#fff}
.toast-error{background:var(--danger);color:#fff}
.toast-info{background:var(--primary);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn .3s ease}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:#fff;border-radius:var(--radius);max-width:600px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* Layout */
.container{max-width:960px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;padding:16px 20px;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:700}.header p{font-size:12px;opacity:.9}
.nav-back{color:#fff;opacity:.9;font-size:14px;cursor:pointer}.nav-back:hover{opacity:1}

/* Panel Cards */
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:20px}
.panel-card{background:var(--card);border-radius:var(--radius-lg);padding:28px 24px;box-shadow:var(--shadow-lg);cursor:pointer;transition:all .25s;border:2px solid transparent;text-align:center}
.panel-card:hover{transform:translateY(-4px);box-shadow:0 20px 25px -5px rgba(0,0,0,.15)}
.panel-card.newbie{border-color:var(--newbie-color)}.panel-card.newbie:hover{background:var(--newbie-light)}
.panel-card.tech{border-color:var(--tech-color)}.panel-card.tech:hover{background:var(--tech-light)}
.panel-card.sales{border-color:var(--sales-color)}.panel-card.sales:hover{background:var(--sales-light)}
.panel-icon{font-size:48px;margin-bottom:12px;line-height:1}
.panel-title{font-size:20px;font-weight:700;margin-bottom:6px}
.panel-desc{font-size:13px;color:var(--text-sec);margin-bottom:12px;line-height:1.5}
.panel-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* Home Hero */
.home-hero{text-align:center;padding:30px 20px 10px}
.home-hero h1{font-size:24px;font-weight:800;margin-bottom:6px}
.home-hero p{font-size:14px;color:var(--text-sec);margin-bottom:12px}

/* Exam List */
.exam-list{display:flex;flex-direction:column;gap:10px}
.exam-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#fff;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.exam-item:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.exam-item.blocked{opacity:.6;cursor:not-allowed}
.exam-item-info{flex:1}.exam-item-title{font-size:15px;font-weight:600}.exam-item-desc{font-size:12px;color:var(--text-sec);margin-top:2px}
.exam-item-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-sec)}

/* Week Section */
.week-section{margin-bottom:24px}
.week-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-radius:var(--radius-sm);border-left:3px solid var(--primary)}

/* Brand Section */
.brand-section{margin-bottom:20px}
.brand-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.brand-dot{width:8px;height:8px;border-radius:50%}
.brand-dot.nova{background:var(--nova)}.brand-dot.haidong{background:var(--haidong)}

/* Quiz */
.quiz-header{position:sticky;top:57px;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;z-index:99;box-shadow:var(--shadow)}
.quiz-timer{font-size:18px;font-weight:700;color:var(--danger)}
.quiz-progress{font-size:13px;color:var(--text-sec)}
.question-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.question-type{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;margin-bottom:8px}
.question-type.single{background:#dbeafe;color:#1e40af}
.question-type.multiple{background:#fce7f3;color:#9d174d}
.question-type.judge{background:#d1fae5;color:#065f46}
.question-type.short{background:#fef3c7;color:#92400e}
.question-text{font-size:15px;font-weight:600;margin-bottom:14px;line-height:1.7}
.question-options{display:flex;flex-direction:column;gap:8px}
.option-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.option-item:hover{border-color:var(--primary);background:var(--primary-light)}
.option-item.selected{border-color:var(--primary);background:var(--primary-light)}
.option-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.option-item.selected .option-radio{border-color:var(--primary)}
.option-item.selected .option-radio::after{content:'';width:10px;height:10px;background:var(--primary);border-radius:50%}
.option-checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.option-item.selected .option-checkbox{border-color:var(--primary);background:var(--primary)}
.option-item.selected .option-checkbox::after{content:'✓';color:#fff;font-size:14px;font-weight:700}
.option-text{flex:1;font-size:14px}
.judge-btns{display:flex;gap:12px}
.judge-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.judge-btn:hover{border-color:var(--primary)}
.judge-btn.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.short-answer{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;resize:vertical;font-family:inherit}
.short-answer:focus{outline:none;border-color:var(--primary)}

/* Score */
.score-display{text-align:center;padding:30px 20px}
.score-number{font-size:56px;font-weight:800;line-height:1}
.score-pass{color:var(--success)}.score-fail{color:var(--danger)}
.score-status{font-size:20px;font-weight:700;margin-top:12px}
.score-breakdown{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.score-item{background:#f8fafc;border-radius:var(--radius-sm);padding:12px;text-align:center}
.score-item-label{font-size:12px;color:var(--text-sec)}.score-item-value{font-size:18px;font-weight:700;margin-top:4px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;text-align:center}
.stat-value{font-size:28px;font-weight:800;line-height:1}.stat-label{font-size:12px;color:var(--text-sec);margin-top:4px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 18px;font-size:14px;font-weight:600;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}

/* Table */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:2px solid var(--border);font-weight:600;white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.table tr:hover{background:#f8fafc}

/* Answer Detail */
.answer-detail{background:#f8fafc;border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.answer-detail-q{font-size:14px;font-weight:600;margin-bottom:6px}
.answer-correct{color:var(--success);font-weight:600}.answer-wrong{color:var(--danger);font-weight:600}
.scoring-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.scoring-answer{background:#f8fafc;padding:10px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:8px;max-height:150px;overflow-y:auto}
.scoring-input{width:80px;padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;text-align:center}

/* Empty */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-sec)}
.empty-state-text{font-size:14px}

/* Panel Tabs */
.panel-tabs{display:flex;gap:0;margin-bottom:20px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.panel-tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:var(--card);color:var(--text-sec);border:none}
.panel-tab.active{color:#fff}
.panel-tab.active.newbie{background:var(--newbie-color)}
.panel-tab.active.tech{background:var(--tech-color)}
.panel-tab.active.sales{background:var(--sales-color)}

/* Mentor */
.mentor-only{background:var(--warning-light);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;color:var(--warning);margin-bottom:12px}

@media(max-width:640px){
.container{padding:12px}
.panel-grid{grid-template-columns:1fr}
.home-hero h1{font-size:20px}
.score-number{font-size:44px}
.stat-grid{grid-template-columns:repeat(2,1fr)}
.table{font-size:12px}.table th,.table td{padding:6px 8px}
.question-card{padding:14px}
}

/* Question Bank */
.qbank-item{transition:all .2s}
.qbank-item:hover{box-shadow:var(--shadow)}
.qbank-search{width:200px;padding:6px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px}

/* Weak Areas */
.weak-areas-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.weak-error-high{color:var(--danger);font-weight:700}
.weak-error-mid{color:var(--warning);font-weight:700}
.weak-error-low{color:var(--success);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=2"></script>
</body>
</html>
